server {
    listen 80;
    listen [::]:80;
    server_name flicker.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name flicker.example.com;

    ssl_certificate /etc/letsencrypt/live/flicker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flicker.example.com/privkey.pem;

    root /home/deploy/app/frontend;
    index index.html;

    location = /health {
        proxy_pass http://127.0.0.1:50000;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://127.0.0.1:50000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /rooms {
        proxy_pass http://127.0.0.1:50000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
