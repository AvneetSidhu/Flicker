name: Build & Deploy On Server

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Build Backend (Go SFU)
      - name: Build Backend
        run: |
          go mod tidy
          BUILD_DATE=$(date +%Y-%m-%d)
          BUILD_TIME=$(date +%H:%M:%S)
          go build \
            -ldflags "-X main.buildDate=${BUILD_DATE} -X main.buildTime=${BUILD_TIME}" \
            -o backend-binary ./cmd/sfu

      # Build Frontend (Vite)
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # Stop Backend Before Deploying
      - name: Stop Backend Service
        run: sudo systemctl stop myapp || true

      # Deploy Backend Binary
      - name: Deploy Backend
        run: |
          cp backend-binary /home/deploy/app/backend/backend-binary
          chmod +x /home/deploy/app/backend/backend-binary

      # Deploy VM Agent Binary into base VM disk image
      # vmagent runs inside the VM, not on the SFU host.
      # virt-customize injects the binary directly into the offline disk.
      # Requires: libguestfs-tools installed on the runner (apt install libguestfs-tools).
      # Requires: the runner user to have access to /var/lib/libvirt/images (libvirt group).
      - name: Deploy VM Agent
        run: |
          BUILD_DATE=$(date +%Y-%m-%d)
          BUILD_TIME=$(date +%H:%M:%S)
          GIT_COMMIT=$(git rev-parse --short HEAD)
          go build \
            -ldflags "-X main.buildDate=${BUILD_DATE} -X main.buildTime=${BUILD_TIME}" \
            -o /tmp/vmagent-binary ./cmd/vmagent

          printf "build_date=%s\nbuild_time=%s\ngit_commit=%s\n" \
            "${BUILD_DATE}" "${BUILD_TIME}" "${GIT_COMMIT}" > /tmp/vmagent-version.txt

          cat > /tmp/vmagent.service << 'EOF'
          [Unit]
          Description=Flicker VM Agent
          After=network.target network-online.target
          Wants=network-online.target
          ConditionPathExists=/etc/vmagent.env

          [Service]
          EnvironmentFile=/etc/vmagent.env
          ExecStart=/usr/local/bin/vmagent
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF

          virsh -c qemu:///system shutdown flicker-node || true
          for i in $(seq 1 12); do
            STATE=$(virsh -c qemu:///system domstate flicker-node 2>/dev/null || echo "shut off")
            if [ "$STATE" = "shut off" ]; then break; fi
            sleep 5
          done
          sudo LIBGUESTFS_BACKEND=direct virt-customize --connect qemu:///system --no-network -d flicker-node \
            --upload /tmp/vmagent-binary:/usr/local/bin/vmagent \
            --chmod 0755:/usr/local/bin/vmagent \
            --upload /tmp/vmagent.service:/etc/systemd/system/vmagent.service \
            --run-command 'chmod 0644 /etc/systemd/system/vmagent.service' \
            --run-command 'systemctl enable vmagent' \
            --upload /tmp/vmagent-version.txt:/etc/vmagent-version.txt \
            --chmod 0644:/etc/vmagent-version.txt
          rm /tmp/vmagent-binary /tmp/vmagent.service /tmp/vmagent-version.txt

      # Deploy Frontend Files
      - name: Deploy Frontend
        run: |
          rm -rf /home/deploy/app/frontend/*
          cp -r frontend/dist/* /home/deploy/app/frontend/

      # Fix Permissions for Nginx to Serve Frontend
      - name: Fix Frontend Permissions
        run: |
          sudo chown -R deploy:www-data /home/deploy/app/frontend
          sudo find /home/deploy/app/frontend -type d -exec chmod 755 {} \;
          sudo find /home/deploy/app/frontend -type f -exec chmod 644 {} \;

      # Restart Backend Service
      - name: Start Backend Service
        run: sudo systemctl start myapp

      # Reload Nginx to serve new frontend files
      - name: Reload Nginx
        run: sudo systemctl reload nginx
