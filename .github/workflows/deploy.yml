name: Build & Deploy On Server

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          path: source

      - name: Clean Workspace
        run: |
          rm -rf /home/deploy/source

      # Build Backend (Go SFU)
      - name: Build Backend
        working-directory: source
        run: |
          go mod tidy
          go build -o backend-binary ./cmd/sfu

      # Build Frontend (Vite)
      - name: Build Frontend
        working-directory: source/frontend
        run: |
          npm install
          npm run build

      # Stop Backend Before Deploying
      - name: Stop Backend Service
        run: |
          sudo systemctl stop myapp || true

      # Deploy Backend Binary
      - name: Deploy Backend
        run: |
          cp /home/deploy/source/backend-binary /home/deploy/app/backend/backend-binary
          chmod +x /home/deploy/app/backend/backend-binary

      # Deploy Frontend Files
      - name: Deploy Frontend
        run: |
          rm -rf /home/deploy/app/frontend/*
          cp -r /home/deploy/source/frontend/dist/* /home/deploy/app/frontend/

      # Fix Permissions for Nginx
      - name: Fix Frontend Permissions
        run: |
          sudo chown -R deploy:www-data /home/deploy/app/frontend
          sudo find /home/deploy/app/frontend -type d -exec chmod 755 {} \;
          sudo find /home/deploy/app/frontend -type f -exec chmod 644 {} \;

      # Restart Backend Service
      - name: Start Backend Service
        run: |
          sudo systemctl start myapp
