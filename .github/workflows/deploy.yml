name: Build & Deploy On Server

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Build Backend (Go SFU)
      - name: Build Backend
        run: |
          go mod tidy
          go build -o backend-binary ./cmd/sfu

      # Build Frontend (Vite)
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # Stop Backend Before Deploying
      - name: Stop Backend Service
        run: sudo systemctl stop myapp || true

      # Deploy Backend Binary
      - name: Deploy Backend
        run: |
          cp backend-binary /home/deploy/app/backend/backend-binary
          chmod +x /home/deploy/app/backend/backend-binary

      # Deploy VM Agent Binary into base VM disk image
      # vmagent runs inside the VM, not on the SFU host.
      # virt-customize injects the binary directly into the offline disk.
      # Requires: libguestfs-tools installed on the runner (apt install libguestfs-tools).
      # Requires: the runner user to have access to /var/lib/libvirt/images (libvirt group).
      - name: Deploy VM Agent
        run: |
          go build -o /tmp/vmagent-binary ./cmd/vmagent
          virt-customize -d flicker-node \
            --upload /tmp/vmagent-binary:/usr/local/bin/vmagent \
            --chmod 0755:/usr/local/bin/vmagent
          rm /tmp/vmagent-binary

      # Deploy Frontend Files
      - name: Deploy Frontend
        run: |
          rm -rf /home/deploy/app/frontend/*
          cp -r frontend/dist/* /home/deploy/app/frontend/

      # Fix Permissions for Nginx to Serve Frontend
      - name: Fix Frontend Permissions
        run: |
          sudo chown -R deploy:www-data /home/deploy/app/frontend
          sudo find /home/deploy/app/frontend -type d -exec chmod 755 {} \;
          sudo find /home/deploy/app/frontend -type f -exec chmod 644 {} \;

      # Restart Backend Service
      - name: Start Backend Service
        run: sudo systemctl start myapp
